<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdfa" />

    <meta
      name="description"
      content="Página não encontrada - VET MAX."
    />

    <title>404 | Página não encontrada - VET MAX</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: #292524;
        background:
          radial-gradient(circle at top right, #ffedd5 0, transparent 38%),
          #fffdfa;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
      }

      .card {
        width: 100%;
        max-width: 570px;
        padding: 45px 30px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #fed7aa;
        border-radius: 24px;
        box-shadow: 0 15px 45px rgba(120, 53, 15, 0.08);
      }

      .brand {
        display: inline-block;
        padding: 11px 18px;
        margin-bottom: 25px;
        color: #ffffff;
        background: #f97316;
        border-radius: 12px;
        font-size: 19px;
        font-weight: 800;
      }

      .number {
        margin: 0;
        color: #f97316;
        font-size: clamp(76px, 16vw, 120px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -5px;
      }

      .paw {
        margin: 18px 0;
        font-size: 45px;
      }

      h1 {
        margin: 0 0 15px;
        color: #9a3412;
        font-size: clamp(23px, 5vw, 30px);
      }

      p {
        max-width: 430px;
        margin: 0 auto;
        color: #78716c;
        font-size: 15px;
        line-height: 1.8;
      }

      .button {
        display: inline-block;
        margin-top: 28px;
        padding: 14px 25px;
        color: #ffffff;
        background: #f97316;
        border-radius: 12px;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        transition: background 0.2s;
      }

      .button:hover {
        background: #ea580c;
      }

      footer {
        margin-top: 35px;
        color: #a8a29e;
        font-size: 11px;
      }
    </style>
  </head>

  <body>
    <main>
      <section class="card">
        <div class="brand">🐾 VET MAX</div>

        <div class="number">404</div>

        <div class="paw" aria-hidden="true">🐾</div>

        <h1>Ops! Página não encontrada.</h1>

        <p>
          Parece que este caminho não existe ou foi alterado.
          Mas não se preocupe: você pode voltar ao início
          e continuar navegando pelo VET MAX.
        </p>

        <a class="button" href="/SISTEMA-VET/">
          Voltar ao início
        </a>

        <footer>
          © 2026 VET MAX. Todos os direitos reservados.
          <br />
          Sua clínica evolui. Sua gestão acompanha.
        </footer>
      </section>
    </main>

</html>
